name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite
      - name: Run tests
        run: pytest tests/ -v

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check app/

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-lint, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build ./backend -t intervuo-backend:ci
      - name: Build frontend image
        run: docker build ./frontend -t intervuo-frontend:ci
